name: Lint

on:
  push:
    paths:
      - '.github/workflows/lint.yml'
      - '**.lua'
      - '.luarc.json'
  # No path filter: runs on every PR so it can serve as a required status check.
  pull_request:
  workflow_dispatch:

# Only keep the newest run per ref; cancel superseded ones.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the check only reads the checkout.
permissions:
  contents: read

jobs:
  luals:
    name: lua-language-server
    runs-on: ubuntu-latest

    env:
      LLS_VERSION: 3.18.2

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache lua-language-server
      uses: actions/cache@v4
      id: llscache
      with:
        path: ~/.lua-language-server
        key: ${{ runner.os }}-lua-language-server-${{ env.LLS_VERSION }}

    - name: Install lua-language-server
      if: steps.llscache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.lua-language-server
        wget -qO- "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" | tar -xzf - -C ~/.lua-language-server

    - name: Check
      run: ~/.lua-language-server/bin/lua-language-server --check "$GITHUB_WORKSPACE" --checklevel=Warning
